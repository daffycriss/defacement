<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Defacement Indicators</title>
    <link rel="shortcut icon" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-light">
<!-- Flash messages -->
<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: body}"></div>

<div class="align-items-start min-vh-100 content-wrapper">
    <main class="page-container text-light rounded">

        <h1 class="text-center mb-4">Active Indicators</h1>

        <div class="admin-container mx-auto">

            <div class="card p-4 shadow-sm form-card">
                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <h4 class="mb-0">
                            Enabled Indicators
                        </h4>

                        <span class="badge bg-success"
                              th:text="${#lists.size(indicators)} + ' Active'">
                        </span>

                    </div>

                    <div th:if="${#lists.isEmpty(indicators)}"
                         class="alert alert-info">
                        No active indicators are currently registered.
                    </div>

                    <div th:unless="${#lists.isEmpty(indicators)}"
                         class="table-responsive">

                        <table class="table table-bordered table-striped">

                            <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Type</th>
                                <th>Value</th>
                                <th>Target(s)</th>
<!--                                <th>File Name</th>-->
<!--                                <th>Hash</th>-->
                                <th>Description</th>
                                <th>Created By</th>
                            </tr>
                            </thead>

                            <tbody>

                            <tr th:each="indicator : ${indicators}">

                                <td th:text="${indicator.id}"></td>

                                <td>
                                    <span class="badge bg-secondary"
                                          th:text="${indicator.type}">
                                    </span>
                                </td>

                                <td th:text="${indicator.value ?: '-'}"></td>

                                <td>
                                    <ul class="mb-0 ps-3"
                                        th:if="${!indicator.targetNames.isEmpty()}">
                                        <li th:each="target : ${indicator.targetNames}"
                                            th:text="${target}">
                                        </li>
                                    </ul>

                                    <span th:if="${indicator.targetNames.isEmpty()}"
                                          class="text-muted">
                                            Not assigned
                                    </span>
                                </td>

<!--                                <td th:text="${indicator.filename ?: '-'}"></td>-->

<!--                                <td th:text="${indicator.hashValue ?: '-'}"></td>-->

                                <td th:text="${indicator.description ?: '-'}"></td>

                                <td th:text="${indicator.createdBy}"></td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                    <div class="mt-3">
                        <a th:href="@{/dashboard}"
                           class="btn btn-secondary">
                            Back to Dashboard
                        </a>
                    </div>

                </div>
            </div>

        </div>

    </main>
</div>


<!-- Include Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/autohideflashmessagesafterfiveseconds.js}"></script>

</body>
</html>
